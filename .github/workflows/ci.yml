name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: forma
          POSTGRES_PASSWORD: forma
          POSTGRES_DB: forma
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U forma" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      FORMA_TEST_PG_URL: postgresql+psycopg://forma:forma@localhost:5432/forma
      FORMA_TEST_S3_ENDPOINT: http://localhost:9000
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Install backend
        working-directory: backend
        run: uv venv --python 3.12 && uv pip install -e ".[dev]"
      - name: Start isolated MinIO
        run: |
          docker run -d --name forma-ci-minio -p 127.0.0.1:9000:9000 \
            -e MINIO_ROOT_USER=forma -e MINIO_ROOT_PASSWORD=forma12345 \
            minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e server /data
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:9000/minio/health/live; then exit 0; fi
            sleep 1
          done
          docker logs forma-ci-minio
          exit 1
      - name: Lint + types
        working-directory: backend
        run: |
          .venv/bin/ruff check . && .venv/bin/ruff format --check . && .venv/bin/mypy
      - name: Tests (SQLite + real Postgres + MinIO)
        working-directory: backend
        run: .venv/bin/pytest --cov=forma --cov-report=term-missing:skip-covered --cov-fail-under=85
      - name: Migration drift guard
        working-directory: backend
        run: .venv/bin/pytest -q tests/test_migrations.py -k models_and_migrations_agree --no-cov
      - name: Config example drift guard
        working-directory: backend
        run: .venv/bin/forma config example --check ../.env.production.example
      - name: Server capacity and isolated Compose gates
        run: |
          backend/.venv/bin/ruff check deploy/server deploy/repro
          backend/.venv/bin/ruff format --check deploy/server deploy/repro
          backend/.venv/bin/python deploy/server/test_plan.py
          backend/.venv/bin/python deploy/server/test_compose.py
      - name: Eval vs baseline
        working-directory: backend
        run: .venv/bin/forma eval --corpus ../data/synthetic --report ../data/eval_report.json --baseline ../data/eval_baseline.json
      - name: Bench (short)
        working-directory: backend
        run: .venv/bin/forma bench --files 6 --rows 2000 --distinct 3 --out ../data/bench_short
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports
          path: |
            data/eval_report.json
            data/bench_short/report.md
          if-no-files-found: ignore

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: npm ci --no-audit --no-fund
      - working-directory: frontend
        run: npx oxlint src
      - working-directory: frontend
        run: npm test
      - working-directory: frontend
        run: npm run build

  images:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build backend image
        run: docker build -f backend/Dockerfile -t forma-api:ci .
      - name: Build web image
        run: docker build -f frontend/Dockerfile -t forma-web:ci frontend
      - name: Validate web proxy configuration
        run: docker run --rm --network none --entrypoint nginx forma-web:ci -t
      - name: Build sandbox image
        run: docker build -f deploy/sandbox/Dockerfile -t forma-sandbox:ci .
      - name: Compose config is valid
        run: cp .env.production.example .env.production && docker compose -f docker-compose.prod.yml config -q
      - name: Validate operational alert rules
        run: >-
          docker run --rm --network none --entrypoint /bin/promtool
          -v "$PWD/deploy/monitoring:/rules:ro"
          prom/prometheus@sha256:075b1ba2c4ebb04bc3a6ab86c06ec8d8099f8fda1c96ef6d104d9bb1def1d8bc
          check rules /rules/alerts.yml
