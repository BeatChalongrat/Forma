name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: forma
          POSTGRES_PASSWORD: forma
          POSTGRES_DB: forma
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U forma" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      FORMA_TEST_PG_URL: postgresql+psycopg://forma:forma@localhost:5432/forma
      FORMA_TEST_S3_ENDPOINT: http://localhost:9000
      FORMA_TEST_SERVICES_DISPOSABLE: "1"
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Install backend
        working-directory: backend
        run: uv venv --python 3.12 && uv pip install --python .venv/bin/python -e ".[dev]"
      - name: Start isolated MinIO
        run: |
          docker build -f deploy/testing/Minio.Dockerfile --target server -t forma-ci-minio .
          docker run -d --name forma-ci-minio -p 127.0.0.1:9000:9000 \
            -e MINIO_ROOT_USER=forma -e MINIO_ROOT_PASSWORD=forma12345 \
            forma-ci-minio server /data
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:9000/minio/health/live; then exit 0; fi
            sleep 1
          done
          docker logs forma-ci-minio
          exit 1
      - name: Backend gates (SQLite + real Postgres + MinIO)
        run: backend/.venv/bin/python tools/quality.py backend --out test-results/backend
      - name: Migration drift guard
        working-directory: backend
        run: .venv/bin/pytest -q tests/test_migrations.py -k models_and_migrations_agree --no-cov
      - name: Config example drift guard
        working-directory: backend
        run: .venv/bin/forma config example --check ../.env.production.example
      - name: Server capacity and isolated Compose gates
        run: |
          backend/.venv/bin/ruff check deploy/server deploy/repro tools
          backend/.venv/bin/ruff format --check deploy/server deploy/repro tools
          backend/.venv/bin/python deploy/server/test_plan.py
          backend/.venv/bin/python deploy/server/test_compose.py
      - name: Deterministic eval and multi-sheet contracts
        run: backend/.venv/bin/python tools/quality.py eval --out test-results/eval
      - name: Bench (short)
        working-directory: backend
        run: .venv/bin/forma bench --files 6 --rows 2000 --distinct 3 --out ../data/bench_short
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports
          path: |
            test-results/
            data/bench_short/report.md
          if-no-files-found: ignore

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: npm ci --no-audit --no-fund
      - working-directory: frontend
        run: npx oxlint src
      - working-directory: frontend
        run: npm run test:typecheck
      - working-directory: frontend
        run: npm run test:coverage
      - name: Frontend line and branch floors, including critical modules
        run: python tools/coverage_gate.py frontend test-results/frontend/coverage/coverage-summary.json --out test-results/frontend/frontend-coverage-gate.json
      - working-directory: frontend
        run: npm run build
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-evidence
          path: test-results/frontend/
          retention-days: 14

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: backend
        run: uv venv --python 3.12 && uv pip install --python .venv/bin/python -e ".[dev]"
      - working-directory: frontend
        run: npm ci --no-audit --no-fund && npx playwright install --with-deps chromium
      - name: Isolated browser journeys, no provider credentials
        run: backend/.venv/bin/python tools/quality.py browser --out test-results/browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-evidence
          path: test-results/browser/
          retention-days: 14

  images:
    runs-on: ubuntu-latest
    needs: [backend, frontend, browser]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build backend image
        run: docker build -f backend/Dockerfile -t forma-api:ci .
      - name: Build web image
        run: docker build -f frontend/Dockerfile -t forma-web:ci frontend
      - name: Validate web proxy configuration
        run: docker run --rm --network none --entrypoint nginx forma-web:ci -t
      - name: Build sandbox image
        run: docker build -f deploy/sandbox/Dockerfile -t forma-sandbox:ci .
      - name: Record candidate image IDs
        run: python tools/release_gate.py --record-images --sha "$GITHUB_SHA" --out test-results/images.json
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - working-directory: backend
        run: uv venv --python 3.12 && uv pip install --python .venv/bin/python -e ".[dev]"
      - name: Real Office and PDF renderer without provider or network
        run: backend/.venv/bin/python tools/quality.py renderer --report-image forma-sandbox:ci --out test-results/renderer
      - name: Compose config is valid
        run: cp .env.production.example .env.production && docker compose -f docker-compose.prod.yml config -q
      - name: Validate operational alert rules
        run: >-
          docker run --rm --network none --entrypoint /bin/promtool
          -v "$PWD/deploy/monitoring:/rules:ro"
          prom/prometheus@sha256:075b1ba2c4ebb04bc3a6ab86c06ec8d8099f8fda1c96ef6d104d9bb1def1d8bc
          check rules /rules/alerts.yml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: renderer-evidence
          path: test-results/
          retention-days: 14

  critical-flows:
    if: always()
    needs: [backend, frontend, browser]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: reports
          path: evidence/backend
      - uses: actions/download-artifact@v4
        with:
          name: frontend-evidence
          path: evidence/frontend
      - uses: actions/download-artifact@v4
        with:
          name: browser-evidence
          path: evidence/browser
      - name: Verify every critical journey from this run
        run: python tools/critical_flows.py --evidence evidence --out test-results/critical-flows.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: critical-flows
          path: test-results/critical-flows.json

  quality-gate:
    if: always()
    needs: [backend, frontend, browser, images, critical-flows]
    runs-on: ubuntu-latest
    steps:
      - name: Require every gate, including non-skipped dependencies
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python -c 'import json,os; r=json.loads(os.environ["RESULTS"]); assert all(v["result"] == "success" for v in r.values()), r'
