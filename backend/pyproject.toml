[project]
name = "forma"
version = "0.1.0"
description = "FORMA — AI-Native Data Transformation & Operations Platform (backend)"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "polars>=1.10",
  "fastexcel>=0.12",
  "openpyxl>=3.1",
  "duckdb>=1.1",
  "jsonschema>=4.23",
  "pyyaml>=6.0",
  "typer>=0.12",
  "structlog>=24.4",
  "httpx>=0.27",
  "python-multipart>=0.0.9",
  "python-ulid>=2.7",
  "orjson>=3.10",
  "charset-normalizer>=3.3",
  "rapidfuzz>=3.9",
  "psycopg[binary]>=3.2",
  "fastjsonschema>=2.20",
  "arq>=0.26",
  "psutil>=6.0",
  "boto3>=1.35",
  "pyjwt[crypto]>=2.9",
  "cryptography>=42",
  "prometheus-client>=0.20",
  "langgraph==1.2.19",
  "langgraph-checkpoint-postgres==3.2.0",
  "langgraph-checkpoint-sqlite==3.1.3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "mypy>=1.11",
  "types-PyYAML",
  "types-jsonschema",
  "faker>=28.0",
  "moto[s3]>=5.0",
]

[project.scripts]
forma = "forma.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/forma"]

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003", "B008", "RUF012"]

[tool.ruff.lint.per-file-ignores]
# `ruff format` owns line length for code; E501 remains only for long literal strings (prompts,
# Thai header dictionaries, f-string messages) that the formatter cannot split.
"src/forma/ai/agents.py" = ["E501"]
"src/forma/ai/heuristics.py" = ["E501"]
"src/forma/ai/policy.py" = ["E501"]
"src/forma/api/routes.py" = ["E501"]
"src/forma/cli.py" = ["E501"]
"src/forma/engine/transform.py" = ["E501"]
"src/forma/eval/evaluate.py" = ["E501"]
"src/forma/ingestion/*.py" = ["E501"]
"src/forma/services/*.py" = ["E501"]
"src/forma/synth/*.py" = ["E501"]
"tests/*.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
warn_unused_ignores = false
packages = ["forma"]
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
# Local combined coverage floor; tools/quality.py additionally gates lines and branches independently.
addopts = "-q --cov=forma --cov-report=term-missing:skip-covered --cov-fail-under=80"
filterwarnings = ["ignore::DeprecationWarning"]
markers = ["slow: long-running (process pool, benchmarks)"]

[tool.coverage.run]
source = ["forma"]
branch = true

[tool.coverage.report]
precision = 1
exclude_also = ["if TYPE_CHECKING:", "pragma: no cover"]

[tool.uv]
dev-dependencies = []
