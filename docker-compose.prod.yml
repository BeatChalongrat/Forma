# Production topology (ADR-016): web (nginx + built SPA) → api → postgres / redis / minio, N workers.
#   cp .env.production.example .env.production   # fill in secrets
#   docker compose -f docker-compose.prod.yml --env-file .env.production up -d --build --scale worker=4
#   docker compose -f docker-compose.prod.yml --profile otel up -d   # with the OpenTelemetry collector
# Auth: set FORMA_AUTH=oidc (+ issuer, client id) in .env.production — the api refuses FORMA_AUTH=dev in
# prod; FORMA_AUTH_ALLOW_DEV_IN_PROD=true is for a local smoke test of this stack only (ADR-013).
x-forma-env: &forma-env
  env_file: .env.production
  environment:
    FORMA_ENV: prod
    FORMA_DATA_DIR: /data                       # container contract: overrides the dev-relative defaults
    FORMA_TARGET_SCHEMA_DIR: /app/target_schema
    FORMA_POLICIES_DIR: /app/policies
    FORMA_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-forma}:${POSTGRES_PASSWORD:-forma}@postgres:5432/${POSTGRES_DB:-forma}
    FORMA_JOB_BACKEND: arq
    FORMA_REDIS_URL: redis://redis:6379/0
    FORMA_STORAGE: s3
    FORMA_S3_ENDPOINT_URL: http://minio:9000
    FORMA_S3_PUBLIC_ENDPOINT_URL: ${FORMA_S3_PUBLIC_URL:-http://localhost:9000}
    FORMA_S3_BUCKET: ${FORMA_S3_BUCKET:-forma}
    FORMA_S3_ACCESS_KEY: ${MINIO_ROOT_USER:-forma}
    FORMA_S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-forma12345}
    FORMA_LOG_FORMAT: json
    FORMA_CORS_ORIGINS: '["${FORMA_PUBLIC_URL:-http://localhost}"]'
    FORMA_OTEL_ENDPOINT: ${FORMA_OTEL_ENDPOINT:-}
    FORMA_CODE_SANDBOX_SOCKET: /run/sandbox/runner.sock

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-forma}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-forma}
      POSTGRES_DB: ${POSTGRES_DB:-forma}
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-forma} -d ${POSTGRES_DB:-forma}"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "60", "1", "--appendonly", "yes"]
    volumes: ["redis:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-forma}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-forma12345}
    volumes: ["minio:/data"]
    ports: ["${FORMA_S3_PORT:-9000}:9000", "9001:9001"]   # :9000 for pre-signed downloads, :9001 console
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio: { condition: service_healthy }
    entrypoint: >
      /bin/sh -c "mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-forma} ${MINIO_ROOT_PASSWORD:-forma12345}
      && mc mb --ignore-existing local/${FORMA_S3_BUCKET:-forma} && mc version enable local/${FORMA_S3_BUCKET:-forma} || true"

  migrate:
    build: { context: ., dockerfile: backend/Dockerfile }
    <<: *forma-env
    command: ["forma", "db", "upgrade"]
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"

  api:
    build: { context: ., dockerfile: backend/Dockerfile }
    <<: *forma-env
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
      minio-init: { condition: service_completed_successfully }
    volumes:
      - formadata:/data                   # local cache for S3 objects + tmp
      - sandbox-socket:/run/sandbox       # the only way to the code sandbox (ADR-048)
    expose: ["8000"]
    restart: unless-stopped

  sandbox:
    # The assistant's code runner (ADR-048). No network at all: the API reaches it through one socket on a
    # shared volume, and the code it runs reaches nothing. It holds no secrets and keeps nothing between runs.
    build: { context: ., dockerfile: deploy/sandbox/Dockerfile }
    network_mode: none
    read_only: true
    tmpfs: ["/workspace:size=1g,mode=0711", "/tmp:size=64m,mode=1777"]
    volumes: ["sandbox-socket:/run/sandbox"]
    cap_drop: [ALL]
    cap_add: [SETUID, SETGID, KILL, CHOWN, DAC_OVERRIDE]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 256
    mem_limit: 3g
    memswap_limit: 3g
    cpus: 2
    restart: unless-stopped

  worker:
    build: { context: ., dockerfile: backend/Dockerfile }
    <<: *forma-env
    command: ["forma", "worker"]
    healthcheck:
      test: ["CMD", "python", "-c", "import sys; from forma.jobs.runner import get_backend; sys.exit(1 if get_backend().stats().get('error') else 0)"]
      interval: 30s
      timeout: 10s
      start_period: 20s
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
      minio-init: { condition: service_completed_successfully }
    volumes: ["formadata:/data"]
    deploy:
      replicas: ${FORMA_WORKER_REPLICAS:-2}
    restart: unless-stopped

  web:
    build: { context: ./frontend, dockerfile: Dockerfile }
    depends_on: [api]
    ports: ["${FORMA_WEB_PORT:-80}:80"]
    restart: unless-stopped

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.111.0
    profiles: ["otel"]
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes: ["./deploy/otel-collector.yaml:/etc/otelcol/config.yaml:ro"]
    expose: ["4318"]
    restart: unless-stopped

  backup:
    # nightly backups: `docker compose -f docker-compose.prod.yml run --rm backup`
    build: { context: ., dockerfile: backend/Dockerfile }
    <<: *forma-env
    profiles: ["ops"]
    command: ["forma", "backup", "--out", "/backups", "--archive", "--no-objects"]
    volumes: ["formadata:/data", "backups:/backups"]
    depends_on:
      postgres: { condition: service_healthy }

volumes:
  pgdata: {}
  redis: {}
  minio: {}
  formadata: {}
  backups: {}
  sandbox-socket: {}
