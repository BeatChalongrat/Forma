# FORMA approval policy — AI proposes, policy decides, humans gate what matters.
# Decisions: auto_approve | review | block
version: 1

auto_approve:
  min_mapping_confidence: 0.95          # meta.confidence of the proposal
  min_field_confidence_critical: 0.90   # every critical-risk field must reach this
  min_field_confidence_high: 0.80
  max_warning_findings: 5               # engine warnings (joins, dedupe, quality) tolerated
  allow_errors: false                   # any engine error → review
  allowed_drift: [identical, header_moved, columns_added]   # for returning customers
  require_previous_approval_for_auto: true   # a never-seen customer always goes to review
  max_row_change_ratio: 0.30            # vs previous approved dataset for the same customer

review:
  priority_weights:                      # ordering of the review queue
    critical_field_low_confidence: 50
    errors: 40
    drift_columns_removed: 30
    drift_columns_renamed: 20
    unrelated_file: 100
    new_customer: 15
    warnings: 2
    sandbox_failed: 60
    sandbox_changed_values: 25
  high_impact_ratio: 0.20                # a new mapping changing this share of records is high risk (ADR-019)

block:
  on_unrelated_file: true               # wrong file for this customer → block, never auto
  on_missing_identity: true
  on_zero_rows: true

sandbox:                                 # new mapping vs the approved one, on the same real files (ADR-018)
  enabled: true
  max_lost_records: 0                    # records the approved mapping produces that the new one drops → block
  max_new_errors: 0                      # extra engine/schema errors → block
  max_new_invalid_prices: 0              # extra records without a valid price → block
  max_new_duplicates: 0                  # extra duplicate records → block
  max_changed_prices_auto: 0             # more changed prices than this → a human reviews
  trust_data_checks: false               # ADR-037: identical values on the same SKUs outweigh the sandbox delta and the drift

anomaly:                                 # change intelligence: what counts as unusual in a round (ADR-022)
  max_price_change_pct: 30               # a price moving more than this vs last round
  max_discount_pct: 50                   # a discount above this
  max_stock_drop_pct: 80                 # stock falling more than this vs last round
  max_removed_pct: 10                    # share of last round's SKUs gone
  row_count_tolerance_pct: 30            # records vs the customer's recent average
  outlier_mad: 6                         # price this many robust deviations from its category median
  history_rounds: 5                      # published rounds the row-count baseline averages
  block_approval_on_high: true           # approving data with high anomalies needs an acknowledgement

publish:                                 # automatic publishing of rounds that ask for it (bulk upload, ADR-027)
  enabled: true                          # false: a person approves every dataset
  max_high_anomalies: 0                  # more high-severity anomalies than this → a person checks the data
  max_error_findings: 0                  # engine errors (duplicates, broken links) → a person checks

verdict:                                 # one conclusion per file, from the stored reports (ADR-036)
  min_pairs: 3                           # identity-matched SKUs before data checks may carry a conclusion
  different_share: 0.8                   # share of checked important fields that no longer match → wrong file
  min_group: 5                           # anomalies of one kind before they become one conclusion
  max_must_decide: 3                     # decisions shown on the card; the rest are counted
  narrative: on_open                     # on_open | never — when a model may narrate a verdict

risk_overrides:                          # per-semantic risk overrides (defaults come from the schema)
  "price.amount": critical
  "discount.percent": critical
  "promo.start_date": critical
  "promo.end_date": critical
