<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
  <!-- Office files name fonts a Windows machine has. A preview here uses the Thai font this image ships. -->
  <alias binding="same"><family>Tahoma</family><prefer><family>Noto Sans Thai</family></prefer></alias>
  <alias binding="same"><family>Leelawadee UI</family><prefer><family>Noto Sans Thai</family></prefer></alias>
  <match target="pattern">
    <test name="lang" compare="contains"><string>th</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Noto Sans Thai</string></edit>
  </match>
</fontconfig>
