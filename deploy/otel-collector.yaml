# Minimal OpenTelemetry Collector config for the `otel` compose profile (ADR-014/016).
# Receives OTLP/HTTP from the API and workers, prints spans to the collector log; replace the
# exporter with your backend (Tempo, Jaeger, Datadog, Honeycomb…).
receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
      grpc:
        endpoint: 0.0.0.0:4317
processors:
  batch: {}
exporters:
  debug:
    verbosity: basic
service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug]
