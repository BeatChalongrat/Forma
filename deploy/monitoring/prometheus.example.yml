global:
  scrape_interval: 30s
rule_files:
  - /etc/prometheus/alerts.yml
scrape_configs:
  - job_name: forma
    metrics_path: /metrics
    static_configs:
      - targets: [api:8000]
# Connect Prometheus to the application's private network. Do not expose /metrics publicly.
# Add your existing Alertmanager under alerting.alertmanagers after configuring recipients on the server.
