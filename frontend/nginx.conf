# Docker's embedded resolver follows API container replacements without reloading nginx.
# Dynamic upstream resolution requires nginx >= 1.27.3 (the runtime image provides 1.27.5).
upstream forma_api {
    zone forma_api 64k;
    resolver 127.0.0.11 valid=5s ipv6=off;
    resolver_timeout 3s;
    server api:8000 resolve;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 256m;          # uploads go through here; FORMA_MAX_UPLOAD_MB enforces the real cap
    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    location /api/ {
        proxy_pass http://forma_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $request_id;
        proxy_read_timeout 300s;
    }
    location = /health { proxy_pass http://forma_api; }
    location = /ready  { proxy_pass http://forma_api; }
    # /metrics is deliberately NOT proxied: scrape the api service on the internal network.
    location = /metrics { return 404; }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;     # SPA routes (including /auth/callback)
    }
}
