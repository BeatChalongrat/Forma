# nginx for the FORMA web app (ADR-016). API_UPSTREAM is the compose service name.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 256m;          # uploads go through here; FORMA_MAX_UPLOAD_MB enforces the real cap
    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    location /api/ {
        proxy_pass http://api:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $request_id;
        proxy_read_timeout 300s;
    }
    location = /health { proxy_pass http://api:8000/health; }
    location = /ready  { proxy_pass http://api:8000/ready; }
    # /metrics is deliberately NOT proxied: scrape the api service on the internal network.

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;     # SPA routes (including /auth/callback)
    }
}
